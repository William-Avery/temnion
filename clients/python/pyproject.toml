[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "temnion"
version = "0.1.0"
description = "Official Python client for the Temnion bi-temporal & causal database"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [
    { name = "Temnion Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/William-Avery/temnion"
Documentation = "https://github.com/William-Avery/temnion/tree/main/docs"
Repository = "https://github.com/William-Avery/temnion.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["temnion*"]
