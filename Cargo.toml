[workspace]
resolver = "3"
members = [
    "crates/temnion-core",
    "crates/temnion-state",
    "crates/temnion-events",
    "crates/temnion-format",
    "crates/temnion-schema",
    "crates/temnion-storage",
    "crates/temnion-codec",
    "crates/temnion-replay",
    "crates/temnion-causal",
    "crates/temnion-branch",
    "crates/temnion-index",
    "crates/temnion-runtime",
    "crates/temnion-query",
    "crates/temnion-protocol",
    "crates/temnion-flight",
    "crates/temnion-mcp",
    "crates/temnion-eks",
    "crates/temnion-transform",
    "crates/temnion-evolution",
    "crates/temnion-adapter",
    "crates/temnion-bench",
    "apps/temnion-cli",
    "apps/temniond",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/William-Avery/temnion"

[workspace.dependencies]
temnion-core = { path = "crates/temnion-core" }
temnion-state = { path = "crates/temnion-state" }
temnion-events = { path = "crates/temnion-events" }
temnion-format = { path = "crates/temnion-format" }
temnion-schema = { path = "crates/temnion-schema" }
temnion-storage = { path = "crates/temnion-storage" }
temnion-codec = { path = "crates/temnion-codec" }
temnion-replay = { path = "crates/temnion-replay" }
temnion-causal = { path = "crates/temnion-causal" }
temnion-branch = { path = "crates/temnion-branch" }
temnion-index = { path = "crates/temnion-index" }
temnion-runtime = { path = "crates/temnion-runtime" }
temnion-query = { path = "crates/temnion-query" }
temnion-protocol = { path = "crates/temnion-protocol" }
temnion-flight = { path = "crates/temnion-flight" }
temnion-mcp = { path = "crates/temnion-mcp" }
temnion-eks = { path = "crates/temnion-eks" }
temnion-transform = { path = "crates/temnion-transform" }
temnion-evolution = { path = "crates/temnion-evolution" }
temnion-adapter = { path = "crates/temnion-adapter" }
crc32fast = "1.4"
fs2 = "0.4.3"
getrandom = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
