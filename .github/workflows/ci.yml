name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }} / ${{ matrix.os }} x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        toolchain: ["1.85.0", stable]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Report toolchain
        run: rustc +${{ matrix.toolchain }} --version --verbose
      - name: Check formatting
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - name: Clippy
        run: cargo +${{ matrix.toolchain }} clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo +${{ matrix.toolchain }} test --locked --workspace
      - name: Run foundation demo
        run: cargo +${{ matrix.toolchain }} run --locked -p temnion-cli -- demo

  arm64-cross-check:
    name: Linux ARM64 cross-check only / Rust 1.85.0
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cross-check target
        run: rustup toolchain install 1.85.0 --profile minimal --target aarch64-unknown-linux-gnu --no-self-update
      - name: Type-check all ARM64 targets without linking or execution
        run: cargo +1.85.0 check --locked --workspace --all-targets --target aarch64-unknown-linux-gnu
