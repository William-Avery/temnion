[package]
name = "temnion-studio-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/William-Avery/temnion"
description = "Native host for the Temnion Studio desktop database explorer"

[lib]
name = "temnion_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
temnion-core = { path = "../../../crates/temnion-core" }
temnion-events = { path = "../../../crates/temnion-events" }
temnion-format = { path = "../../../crates/temnion-format" }
temnion-storage = { path = "../../../crates/temnion-storage" }
temnion-query = { path = "../../../crates/temnion-query" }
temnion-branch = { path = "../../../crates/temnion-branch" }
temnion-causal = { path = "../../../crates/temnion-causal" }
temnion-eks = { path = "../../../crates/temnion-eks" }
temnion-adapter = { path = "../../../crates/temnion-adapter" }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
